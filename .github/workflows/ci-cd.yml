name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: smart-queue-mern/server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: smart-queue-mern/server/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm test

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: smart-queue-mern/client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: smart-queue-mern/client/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  docker-build-push:
    needs: [server, client]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push server image
        uses: docker/build-push-action@v6
        with:
          context: ./smart-queue-mern/server
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/smart-queue-server:latest

      - name: Build and push client image
        uses: docker/build-push-action@v6
        with:
          context: ./smart-queue-mern/client
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/smart-queue-client:latest
      - name: Build and push server image
        uses: docker/build-push-action@v6
        with:
          context: ./smart-queue-mern/server
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/smart-queue-server:latest
          provenance: false
          sbom: false

      - name: Build and push client image
        uses: docker/build-push-action@v6
        with:
          context: ./smart-queue-mern/client
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/smart-queue-client:latest
          provenance: false
          sbom: false
