server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Anything under /api gets forwarded to the server container.
    # "server" here is the service name from docker-compose.yml — Docker's
    # internal DNS resolves it to the right container automatically.
    location /api/ {
        proxy_pass http://server:5000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
